<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 标题带 data-i18n：服务端和前端都按它换语言（首页的标题走 meta.title，这页不是） -->
    <title data-i18n="masks.title">卡面遮罩 — HoloCard</title>
  </head>
  <body class="masks-page">
    <div class="pearl" aria-hidden="true"></div>

    <!-- 卡面遮罩：上传做好的平面卡图，出六张互不重叠的箔面遮罩，并用渲染器预览组合效果。逻辑见 src/masks/main.ts -->
    <main class="page masks">
      <header class="page__head">
        <h1><a class="masks__home" href="/">HoloCard</a></h1>
        <div class="page__actions">
          <a class="head-btn" id="docs-link" href="/docs/" data-i18n="head.docs">文档</a>
          <div class="lang" role="group" aria-label="语言" data-i18n-aria="head.lang">
            <button type="button" data-lang="zh" lang="zh-CN">中</button>
            <button type="button" data-lang="en" lang="en">EN</button>
            <button type="button" data-lang="ja" lang="ja">日</button>
          </div>
        </div>
      </header>

      <section class="masks__intro">
        <h2 data-i18n="masks.heading">卡面遮罩</h2>
        <p data-i18n="masks.intro">上传一张做好的卡图，得到卡边、边框、文字、主角、特效、背景六张互不重叠的箔面遮罩，和一张分区总览。</p>
        <label class="masks__upload">
          <input type="file" id="masks-file" accept="image/*" />
          <span data-i18n="masks.choose">选择卡图</span>
        </label>
        <p class="masks__status" id="masks-status" role="status"></p>
      </section>

      <section class="masks__result" id="masks-result" hidden>
        <div class="masks__preview">
          <div class="masks__card" id="masks-card"></div>
          <div class="masks__controls">
            <fieldset>
              <legend data-i18n="masks.shine">哪里闪</legend>
              <label><input type="checkbox" name="region" value="border" /> <span data-i18n="masks.region.border">卡边</span></label>
              <label><input type="checkbox" name="region" value="frame" /> <span data-i18n="masks.region.frame">边框</span></label>
              <label><input type="checkbox" name="region" value="text" /> <span data-i18n="masks.region.text">文字</span></label>
              <label><input type="checkbox" name="region" value="background" checked /> <span data-i18n="masks.region.background">背景</span></label>
              <label><input type="checkbox" name="region" value="character" /> <span data-i18n="masks.region.character">主角</span></label>
              <label><input type="checkbox" name="region" value="effects" /> <span data-i18n="masks.region.effects">特效</span></label>
            </fieldset>
            <label class="masks__foil">
              <span data-i18n="masks.foil">箔面</span>
              <select id="masks-foil">
                <option value="holo" data-i18n="foil.holo">经典闪卡 holo</option>
                <option value="sunpillar" data-i18n="foil.sunpillar">日柱 sunpillar</option>
                <option value="rainbow" data-i18n="foil.rainbow">彩虹闪粉 rainbow</option>
              </select>
            </label>
            <button type="button" class="masks__button" id="masks-combo" data-i18n="masks.downloadCombo">下载当前组合的遮罩</button>
            <p class="masks__keep" data-i18n="masks.keep">结果 24 小时后删除</p>
          </div>
        </div>

        <div class="masks__grid" id="masks-grid"></div>
      </section>

      <footer class="page__foot" data-i18n-html="foot.creditHtml">箔面配方与交互手感移植自 <a href="https://github.com/simeydotme/pokemon-cards-css" target="_blank" rel="noreferrer">pokemon-cards-css</a>（Simon Goellner，GPL-3.0）。本项目同样以 GPL-3.0 发布，源码在 <a href="https://github.com/longsizhuo/holocard" target="_blank" rel="noreferrer">GitHub</a>。</footer>
    </main>

    <script type="module" src="/src/masks/main.ts"></script>
  </body>
</html>
