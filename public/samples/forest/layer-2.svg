<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 734 1024" width="734" height="1024">
  <!-- 前景：狐狸剪影 + 近处草丛。除主体外全透明，光泽会被裁进这个形状里 -->
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1630"/>
      <stop offset="100%" stop-color="#160a18"/>
    </linearGradient>
    <linearGradient id="turf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#160a18"/>
      <stop offset="100%" stop-color="#090510"/>
    </linearGradient>
  </defs>

  <g fill="url(#fur)" transform="translate(360, 690)">
    <!-- 尾巴先画，压在身体后面 -->
    <path d="M-26 152 C -140 164, -190 86, -152 16 C -128 -26, -80 -22, -70 26
             C -62 66, -96 88, -122 72 C -100 100, -52 106, -26 92 Z"/>
    <!-- 身体 -->
    <path d="M-4 24 C 46 28, 78 88, 80 144 C 82 176, 58 190, 14 190 L-56 190
             C -88 190, -100 170, -90 140 C -74 86, -44 34, -4 24 Z"/>
    <!-- 前腿 -->
    <path d="M30 130 C 48 148, 52 174, 46 190 L10 190 C 8 168, 14 142, 30 130 Z"/>
    <!-- 头 -->
    <circle cx="16" cy="-10" r="55"/>
    <!-- 吻部 -->
    <path d="M54 0 L110 18 L54 36 Z"/>
    <!-- 耳朵 -->
    <path d="M-24 -50 L-42 -126 L22 -72 Z"/>
    <path d="M32 -60 L62 -130 L72 -52 Z"/>
  </g>

  <!-- 近处草丛，视差最大，动起来最明显 -->
  <g fill="url(#turf)">
    <path d="M0 902 C 90 874, 176 906, 268 888 C 372 868, 470 902, 576 884
             C 646 872, 692 890, 734 880 L734 1024 L0 1024 Z"/>
    <path d="M42 900 C 50 858, 44 830, 30 806 C 58 824, 72 858, 70 900 Z"/>
    <path d="M118 894 C 130 846, 126 816, 112 790 C 146 812, 158 852, 152 894 Z"/>
    <path d="M232 890 C 240 850, 234 822, 220 798 C 250 818, 262 852, 258 890 Z"/>
    <path d="M498 888 C 510 842, 504 812, 490 786 C 524 810, 536 848, 530 888 Z"/>
    <path d="M622 884 C 630 846, 624 818, 610 794 C 640 814, 652 848, 648 884 Z"/>
  </g>
</svg>
