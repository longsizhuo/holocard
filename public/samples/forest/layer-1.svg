<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 734 1024" width="734" height="1024">
  <!-- 中景：松树林剪影。除了树以外全透明 -->
  <defs>
    <linearGradient id="pine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16243a"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
    <g id="tree">
      <path d="M0 0 L26 62 L14 62 L34 118 L18 118 L40 176 L-40 176 L-18 118 L-34 118 L-14 62 L-26 62 Z"/>
      <rect x="-5" y="172" width="10" height="34"/>
    </g>
  </defs>

  <g fill="url(#pine)">
    <use href="#tree" x="52"  y="626" transform="translate(0,0) scale(1)"/>
    <use href="#tree" x="150" y="588"/>
    <use href="#tree" x="246" y="648"/>
    <use href="#tree" x="352" y="604"/>
    <use href="#tree" x="452" y="660"/>
    <use href="#tree" x="556" y="596"/>
    <use href="#tree" x="668" y="642"/>
    <use href="#tree" x="-16" y="672"/>
  </g>

  <!-- 林线，把树脚连成一条地平线 -->
  <path d="M0 828 C 110 806, 220 842, 330 820 C 440 798, 560 836, 734 812 L734 1024 L0 1024 Z"
        fill="#0b1220"/>
</svg>
