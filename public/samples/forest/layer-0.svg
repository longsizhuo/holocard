<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 734 1024" width="734" height="1024">
  <!-- 最远层：天空、月亮、远山。满幅不透明 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120a2b"/>
      <stop offset="34%" stop-color="#3a1a5c"/>
      <stop offset="58%" stop-color="#8f3a6b"/>
      <stop offset="78%" stop-color="#e06a58"/>
      <stop offset="100%" stop-color="#ffb877"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0%" stop-color="#fff6e0" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ffd9a0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="734" height="1024" fill="url(#sky)"/>

  <g fill="#ffffff">
    <circle cx="78"  cy="112" r="2.4" opacity=".85"/>
    <circle cx="186" cy="64"  r="1.6" opacity=".6"/>
    <circle cx="262" cy="168" r="2.0" opacity=".75"/>
    <circle cx="352" cy="88"  r="1.4" opacity=".5"/>
    <circle cx="438" cy="146" r="2.2" opacity=".8"/>
    <circle cx="646" cy="96"  r="1.8" opacity=".65"/>
    <circle cx="702" cy="204" r="2.4" opacity=".7"/>
    <circle cx="124" cy="252" r="1.5" opacity=".55"/>
    <circle cx="592" cy="318" r="1.7" opacity=".45"/>
    <circle cx="44"  cy="382" r="1.9" opacity=".4"/>
  </g>

  <circle cx="524" cy="228" r="196" fill="url(#moonGlow)"/>
  <circle cx="524" cy="228" r="68" fill="#fff4dc"/>
  <circle cx="548" cy="210" r="11" fill="#f0e2c4" opacity=".55"/>
  <circle cx="506" cy="252" r="16" fill="#f0e2c4" opacity=".4"/>

  <!-- 远山，压低对比让它自然后退 -->
  <path d="M0 706 L118 598 L232 672 L344 552 L472 684 L604 586 L734 656 L734 1024 L0 1024 Z"
        fill="#2a1a46" opacity="0.5"/>
  <path d="M0 782 L96 712 L214 770 L338 690 L462 776 L590 706 L734 764 L734 1024 L0 1024 Z"
        fill="#1f1338" opacity="0.65"/>
</svg>
