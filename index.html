<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      网站图标：现代浏览器用 SVG；.ico 给老浏览器和只认 /favicon.ico 的爬虫；
      iOS 主屏图标会把透明区域填成黑色，所以单独一张带底色的 PNG。
      另外两个备选方案在 docs/favicon-options/，换的话替换 public/ 下这三个文件。
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>HoloCard — 把任意照片变成分层闪卡</title>
    <meta name="description" content="上传一张照片，自动切分前中后景，每层各上各的箔面，渲染成可交互的闪卡。" />
  </head>
  <body>
    <!-- 珠光底：两层缓慢错位漂移的虹彩，靠 CSS 动画驱动，不占 JS -->
    <div class="pearl" aria-hidden="true"></div>

    <main class="page">
      <header class="page__head">
        <h1>HoloCard</h1>
        <p class="page__sub">上传一张照片，自动切成前中后景，每层各上各的箔面，渲染成闪卡。</p>

        <!--
          仓库直链，给人点 Star 用。页脚那个是许可证声明里的同一个地址。
          render 模式（截 OG 图）整个页头都是隐藏的，不会进分享图。
        -->
        <a
          class="gh"
          href="https://github.com/longsizhuo/holocard"
          target="_blank"
          rel="noreferrer"
          title="在 GitHub 上查看并 Star"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
          </svg>
          <span>开源 · 给个 Star</span>
        </a>
      </header>

      <section class="page__body">
        <div class="stage" id="stage"></div>

        <aside class="panel">
          <!--
            上传放在最前面：它是这一页唯一的主动作。
            之前排在所有参数后面，要滚到第二屏才看得见。
          -->
          <div class="drop" id="drop">
            <input type="file" id="file" accept="image/*" hidden />
            <strong>拖一张照片进来</strong>
            <span>或点击选择</span>
          </div>

          <div class="progress" id="progress" hidden>
            <div class="progress__bar"><i id="progress-fill"></i></div>
            <span id="progress-text">准备中</span>
          </div>

          <div class="share" id="share" hidden>
            <button type="button" class="share__btn" id="share-btn">生成分享链接</button>
            <div class="share__result" id="share-result" hidden>
              <input type="text" id="share-url" readonly />
              <button type="button" id="share-copy">复制</button>
            </div>
            <!-- 平时空着，只在出错时填内容。保留策略这类事用户不关心，不占版面 -->
            <small class="field__hint" id="share-hint"></small>
          </div>

          <!--
            导出动图：按设备给格式——iPhone 实况照片、安卓动态照片、电脑 APNG。
            按钮文字由脚本按设备填，见 src/demo/export.ts
          -->
          <div class="export" id="export" hidden>
            <button type="button" class="export__btn" id="export-btn"></button>
            <small class="field__hint" id="export-hint"></small>
          </div>

          <div class="danger" id="owner" hidden>
            <button type="button" class="danger__btn" id="delete-btn">删除这张卡</button>
            <small class="field__hint" id="delete-hint"></small>
          </div>

          <div class="panel__scroll">
            <h2 class="panel__title">各层箔面</h2>
            <p class="panel__lead">
              真实闪卡的底材是箔：主体用不透明油墨盖住所以哑光，背景不盖所以闪。
            </p>
            <div id="foil-list"></div>

            <!-- 调参是次要动作，默认折起来，省下的高度留给卡片 -->
            <details class="more">
              <summary class="more__head">景深与炫光</summary>

              <label class="field">
                <span class="field__label">视差振幅 <output id="out-amp">6%</output></span>
                <input id="ctl-amp" type="range" min="0" max="16" step="0.5" value="6" />
                <small class="field__hint">拉到 0 卡面就是完全平的</small>
              </label>

              <label class="field">
                <span class="field__label">炫光强度 <output id="out-intensity">0.35</output></span>
                <input id="ctl-intensity" type="range" min="0" max="1" step="0.05" value="0.35" />
              </label>

              <label class="field">
                <span class="field__label">角度锐度 <output id="out-sharp">120</output></span>
                <input id="ctl-sharp" type="range" min="10" max="400" step="10" value="120" />
                <small class="field__hint">越大，出五彩的倾角窗口越窄</small>
              </label>

              <div class="readout">
                <span>当前炫光</span>
                <div class="readout__bar"><i id="halo-fill"></i></div>
                <output id="out-halo">0.00</output>
              </div>
            </details>

            <p class="panel__note" id="status">正在加载素材</p>
          </div>
        </aside>
      </section>

      <footer class="page__foot">
        箔面配方与交互手感移植自
        <a href="https://github.com/simeydotme/pokemon-cards-css" target="_blank" rel="noreferrer">pokemon-cards-css</a>
        （Simon Goellner，GPL-3.0）。本项目同样以 GPL-3.0 发布，源码在
        <a href="https://github.com/longsizhuo/holocard" target="_blank" rel="noreferrer">GitHub</a>。
      </footer>
    </main>

    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
