# 打 player-v<版本> 的 tag 时，把 packages/player 发到 npm（包名 @holocard/player）。
#
# 用 npm 的可信发布（Trusted Publishing）：npmjs.com 上 @holocard/player 的设置里登记了「这个仓库的这个工作流」，
# CI 发布时用 GitHub 的 OIDC 临时证明身份，仓库里不存任何 npm 令牌。顺带生成来源证明（provenance）。
#
# 发版：改 packages/player/package.json 的 version，合进 main，然后
#   git tag player-v0.1.1 && git push origin player-v0.1.1
name: 发布 npm 包 @holocard/player

on:
  push:
    tags: ['player-v*']

permissions:
  contents: write   # 发完建 GitHub Release
  id-token: write   # npm 可信发布（OIDC）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # 可信发布要 npm 11.5 以上，Node 22 自带的不够新
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: tag 和包的版本要一致
        run: |
          want="${GITHUB_REF_NAME#player-v}"
          have=$(node -p "require('./packages/player/package.json').version")
          [ "$want" = "$have" ] || { echo "tag 是 $want，packages/player/package.json 是 $have"; exit 1; }
      - run: pnpm exec tsc --noEmit
      - run: pnpm build:player
      # 已经发过的版本（比如第一次手动发的 0.1.0，后来补打 tag）跳过，只补建 Release
      - name: 发到 npm
        working-directory: packages/player
        run: |
          ver="${GITHUB_REF_NAME#player-v}"
          if npm view "@holocard/player@$ver" version >/dev/null 2>&1; then
            echo "@holocard/player@$ver 已经在 npm 上了，跳过发布"
          else
            npm publish --access public --provenance
          fi
      - name: 建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#player-v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          {
            echo "npm: https://www.npmjs.com/package/@holocard/player/v/$ver"
            echo
            echo '```html'
            echo "<script type=\"module\" src=\"https://cdn.jsdelivr.net/npm/@holocard/player@$ver/dist/holocard.js\"></script>"
            echo '<holo-card src="https://example.com/cards/my-card"></holo-card>'
            echo '```'
            echo
            echo "用法见 packages/player/README.md。"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "@holocard/player $ver" --notes-file notes.md
