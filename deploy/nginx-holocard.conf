# HoloCard 静态站点
#
# 只监听本机回环，由 cloudflared 隧道接入，不直接对外暴露端口。
# TLS 在 Cloudflare 边缘终结，这里是纯 HTTP。
#
# 安装：
#   sudo cp nginx-holocard.conf /etc/nginx/sites-available/holocard
#   sudo ln -s /etc/nginx/sites-available/holocard /etc/nginx/sites-enabled/holocard
#   sudo nginx -t && sudo systemctl reload nginx
#
# 注意 nginx 的 add_header 不会向下继承：某个 location 里只要写了一条 add_header，
# server 级别的那些就全部失效。所以下面每个 location 都把跨源隔离的两条头重写了一遍，
# 这不是冗余，删掉任何一处那个路径就会掉出跨源隔离。

server {
    listen 127.0.0.1:8377;
    server_name holocard.longsizhuo.com;

    root /var/www/holocard/current;
    index index.html;

    server_tokens off;
    charset utf-8;

    # 构建时已经预压缩好 .gz，直接发文件，不占 CPU。
    # 流量要经家里的上行带宽出去，26MB 的 wasm 压完只有 6.7MB，差别很大。
    gzip_static on;

    # ---------- 入口页：不缓存，保证发版后立刻生效 ----------
    location / {
        try_files $uri $uri/ =404;

        add_header Cache-Control "no-cache" always;
        # 跨源隔离：onnxruntime-web 的多线程 WASM 需要 SharedArrayBuffer，
        # 而 SharedArrayBuffer 只在跨源隔离的页面里可用
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------- 带哈希的构建产物：内容变了文件名就变，可以永久缓存 ----------
    location /assets/ {
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------- WebAssembly ----------
    # nginx 1.18 自带的 mime.types 里没有 wasm，会按 application/octet-stream 发，
    # 浏览器的 WebAssembly.instantiateStreaming 对 MIME 类型是严格校验的，不对就直接报错。
    # 正则 location 的优先级高于上面的前缀 location，所以 /assets/ 下的 wasm 走这里。
    location ~* \.wasm$ {
        try_files $uri =404;

        types { }
        default_type application/wasm;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------- 源码包 ----------
    # 本项目以 GPL-3.0 发布。公开分发构建产物的同时必须提供对应源码，
    # 这里按 GPL §6d 的做法：在同一个地方、用同样的方式、不另收费地提供。
    location /source/ {
        try_files $uri =404;

        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
