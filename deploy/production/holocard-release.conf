# holocard.service 的覆盖配置，装到 /etc/systemd/system/holocard.service.d/release.conf。
# 服务端按版本放在 /opt/holocard/releases/<版本>/，current 软链指当前版本（见 deploy.sh）。
# 依赖还在 /opt/holocard/node_modules：Node 从版本目录一路往上找，找得到
[Service]
ExecStart=
ExecStart=/opt/holocard/node22/bin/node /opt/holocard/current/holocard-server.mjs
