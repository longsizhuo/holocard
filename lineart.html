<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title data-i18n="lineart.title">线稿提取 — HoloCard</title>
  </head>
  <body class="masks-page">
    <div class="pearl" aria-hidden="true"></div>

    <!-- 线稿提取：上传插画，服务端出灰度线稿和主体遮罩，在这里调深浅、颜色，下载透明底的线稿。逻辑见 src/lineart/main.ts -->
    <main class="page masks">
      <header class="page__head">
        <h1><a class="masks__home" href="/">HoloCard</a></h1>
        <div class="page__actions">
          <a class="head-btn" id="docs-link" href="/docs/" data-i18n="head.docs">文档</a>
          <div class="lang" role="group" aria-label="语言" data-i18n-aria="head.lang">
            <button type="button" data-lang="zh" lang="zh-CN">中</button>
            <button type="button" data-lang="en" lang="en">EN</button>
            <button type="button" data-lang="ja" lang="ja">日</button>
          </div>
        </div>
      </header>

      <section class="masks__intro">
        <h2 data-i18n="lineart.heading">线稿提取</h2>
        <p data-i18n="lineart.intro">上传一张插画，得到透明底的线稿。</p>
        <label class="masks__upload">
          <input type="file" id="lineart-file" accept="image/*" />
          <span data-i18n="lineart.choose">选择图片</span>
        </label>
        <p class="masks__status" id="lineart-status" role="status"></p>
      </section>

      <section class="masks__result" id="lineart-result" hidden>
        <div class="masks__preview">
          <canvas class="lineart__canvas" id="lineart-canvas"></canvas>
          <div class="masks__controls">
            <label class="lineart__field">
              <span data-i18n="lineart.strength">线条深浅</span>
              <input type="range" id="lineart-strength" min="0" max="100" value="50" />
            </label>
            <label class="lineart__field">
              <span data-i18n="lineart.color">线条颜色</span>
              <input type="color" id="lineart-color" value="#000000" />
            </label>
            <label id="lineart-subject-box"><input type="checkbox" id="lineart-subject" checked /> <span data-i18n="lineart.subjectOnly">只要主体</span></label>
            <button type="button" class="masks__button" id="lineart-download" data-i18n="lineart.download">下载 PNG</button>
            <p class="masks__keep" data-i18n="masks.keep">结果 24 小时后删除</p>
          </div>
        </div>
      </section>

      <footer class="page__foot" data-i18n-html="foot.creditHtml">箔面配方与交互手感移植自 <a href="https://github.com/simeydotme/pokemon-cards-css" target="_blank" rel="noreferrer">pokemon-cards-css</a>（Simon Goellner，GPL-3.0）。本项目同样以 GPL-3.0 发布，源码在 <a href="https://github.com/longsizhuo/holocard" target="_blank" rel="noreferrer">GitHub</a>。</footer>
    </main>

    <script type="module" src="/src/lineart/main.ts"></script>
  </body>
</html>
